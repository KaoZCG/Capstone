[project]
# Metadatos del paquete instalable del backend.
name = "altoquecv-backend"
version = "0.1.0"
description = "Backend REST de AltoqueCV"
requires-python = ">=3.10"
dependencies = [
    # Framework ASGI, validación Pydantic y servidor local de desarrollo.
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "email-validator>=2.2,<3.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = [
    # Herramientas usadas únicamente para ejecutar pruebas y no necesarias en producción.
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
# Permite que pytest gestione automáticamente funciones de prueba asíncronas.
asyncio_mode = "auto"

# Hatch necesita saber que el paquete Python se encuentra en la carpeta `app`.
[tool.hatch.build.targets.wheel]
packages = ["app"]

# Regla de formato para mantener líneas legibles.
[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
